plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
    id 'application'
}

group = 'io.realworld'
version = '1.0-SNAPSHOT'

ext {
    slf4j_version = "2.0.9"
    ktor_version = "1.6.8"
    kodein_version = "6.1.0"
    hikaricp_version = "5.1.0"
    h2_version = "2.2.224"
    // 0.14.1 was only ever published to Bintray/JCenter, which no longer serve it, and the
    // 0.1x line cannot talk to H2 2.x (NoSuchMethodError at startup). 0.45.0 supports H2 2.x,
    // is built for Kotlin 1.9 and is the last release before the select{} API was deprecated.
    exposed_version = "0.45.0"
    junit_version = "4.13.2"
    unirest_version = "1.4.9"
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'io.realworld.app.AppKt'
}

// Compile for the lowest JDK in the CI matrix (17) so one build output runs on both 17 and 21.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    // Compile against the JDK 17 class library even on JDK 21, so a 21-only API call fails the
    // build on every CI leg instead of only failing at runtime on 17.
    compilerOptions.freeCompilerArgs.add("-Xjdk-release=17")
}

dependencies {
    implementation "org.slf4j:slf4j-simple:$slf4j_version"
    implementation "io.ktor:ktor-server-netty:$ktor_version"
    implementation "io.ktor:ktor-server-cio:$ktor_version"
    implementation "io.ktor:ktor-jackson:$ktor_version"
    implementation "io.ktor:ktor-auth-jwt:$ktor_version"
    implementation "org.kodein.di:kodein-di-generic-jvm:$kodein_version"
    implementation "com.zaxxer:HikariCP:$hikaricp_version"
    implementation "com.h2database:h2:$h2_version"
    implementation "org.jetbrains.exposed:exposed-core:$exposed_version"
    implementation "org.jetbrains.exposed:exposed-jdbc:$exposed_version"

    testImplementation "junit:junit:$junit_version"
    testImplementation "com.mashape.unirest:unirest-java:$unirest_version"
}

test {
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}
